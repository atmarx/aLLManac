# The aLLManac — deploy to the box on push to main.
# =============================================================================
# The pipeline is deliberately thin: ssh in, sync, `just deploy`.  ALL
# deployment logic lives in the justfile — this file (and the GitLab/GitHub
# equivalents in docs/ci.md) is just the wrapper that invokes it.
#
# WHICH box is not in this file, on purpose.  This repo is public and the
# pipeline config has to be readable by the CI server straight out of git —
# gitignoring it means Woodpecker sees no pipeline at all.  So the deployment's
# own details live in secrets and the tracked file stays generic, the same seam
# as site.example/ vs. site/: the platform is everyone's, the box is yours.
#
# Secrets needed (Woodpecker -> this repo -> Settings -> Secrets):
#   deploy_ssh_key   — an ssh private key the box's deploy user accepts
#   deploy_host      — hostname or IP of the box.  Prefer an IP or an FQDN:
#                      this resolves inside the alpine step container, which
#                      does not inherit your workstation's search domain, so a
#                      bare short name may not resolve there even though it
#                      resolves fine from your desk.
#   deploy_user      — ssh user on the box
#
# Log masking is best-effort — a `set -x` or an error that echoes the host can
# still print it.  The secret keeps the value out of GIT, which is the point.
#
# First deploy (one-time manual steps on the box):
#   sudo apt install just                       # Debian 13 has it
#   git clone <your fork> /opt/almanac
#   cd /opt/almanac
#   just setup
#   # Edit .env — ALMANAC_HOST, INFERENCE_BASE_URL -> a real endpoint (this
#   # box may have no GPU), OPENID_ISSUER to match ALMANAC_HOST.
#   just up
#   # Then wire OPENID_CLIENT_SECRET from Keycloak (README "First boot").
# =============================================================================

labels:
  platform: build

when:
  - branch: main
    event: push

steps:
  - name: deploy-almanac
    image: alpine
    environment:
      SSH_KEY:
        from_secret: deploy_ssh_key
      DEPLOY_HOST:
        from_secret: deploy_host
      DEPLOY_USER:
        from_secret: deploy_user
    commands:
      - apk add --no-cache openssh-client
      # QUOTED, and they have to be: a plain scalar ending in `{ ... }` is a
      # YAML flow MAPPING, not a string, and the compiler rejects the step
      # with a type error rather than a syntax one (pipeline #44).
      - 'test -n "$DEPLOY_HOST" || { echo "ERROR: deploy_host secret is not set"; exit 1; }'
      - 'test -n "$DEPLOY_USER" || { echo "ERROR: deploy_user secret is not set"; exit 1; }'
      - mkdir -p ~/.ssh
      - echo "$SSH_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - ssh-keyscan -p 22 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      # The heredoc is quoted — NOTHING below expands here, it all runs on the
      # box.  Keep it that way: unquoting it to pass one variable across would
      # expand every `$` in fifty lines of remote shell on the wrong side of
      # the ssh.  Nothing needs to cross; DEPLOY_DIR is set on the far side.
      - |
        ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" << 'ENDSSH'
        set -e

        DEPLOY_DIR=/opt/almanac

        # Guard: must be bootstrapped manually first (see header comment)
        if [ ! -d "$DEPLOY_DIR/.git" ]; then
          echo "ERROR: $DEPLOY_DIR is not a git repo."
          echo "Bootstrap:"
          echo "  git clone <your fork of almanac> $DEPLOY_DIR"
          echo "  cd $DEPLOY_DIR && just setup   # then edit .env"
          exit 1
        fi

        # Guard: just must be installed (the deployment logic lives in it)
        if ! command -v just >/dev/null 2>&1; then
          echo "ERROR: just not found on this host.  sudo apt install just"
          exit 1
        fi

        # Guard: .env must exist (not in git, contains real credentials)
        if [ ! -f "$DEPLOY_DIR/.env" ]; then
          echo "ERROR: no .env in $DEPLOY_DIR.  cd $DEPLOY_DIR && just setup"
          exit 1
        fi

        cd "$DEPLOY_DIR"

        # The sync is INLINE git, not `just sync`, and that is deliberate.
        # `just` refuses to run ANY recipe if the justfile doesn't parse — so
        # a syntax error in the justfile makes `just sync` unable to fetch the
        # commit that fixes the justfile.  The deploy box cannot self-heal and
        # needs a human with ssh (pipeline #38, and it took one).
        #
        # This is the bootstrap, not deployment logic: it is the two commands
        # that get the box to the right commit, after which everything still
        # lives in the justfile.  Keep it dependency-free for that reason.
        git fetch origin
        git reset --hard origin/main
        echo "synced to $(git rev-parse --short HEAD)"

        # Fail fast and legibly if the justfile itself is broken, rather than
        # in the middle of a deploy that has already half-run.
        if ! just --list >/dev/null 2>&1; then
          echo "ERROR: justfile does not parse at $(git rev-parse --short HEAD)"
          just --list || true
          exit 1
        fi

        just deploy

        echo "aLLManac deployed."
        ENDSSH

  - name: done
    image: alpine
    commands:
      - echo "almanac pipeline complete"
