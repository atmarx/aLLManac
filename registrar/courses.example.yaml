# The registrar's course records — copied to courses.yaml on first `just up`
# (courses.yaml is gitignored: real rosters are student emails, and those
# don't belong in git).  Operator-edited AND registrar-maintained — the
# roster tools write `students:` back here (file backend), and `just course`
# is the front door for new records.  Full story: docs/registrar-spec.md.
#
# The registrar REWRITES this file, normalized, on every change it makes —
# comments (these included) and keys it doesn't recognize are discarded at
# its first write.  Keep notes somewhere else.
#
# budgets, the three layers (one pool, decided 2026-07-22):
#   course           THE cap — per term, HARD, chat + vAPI keys drain it together
#                    (enforced as the course's LiteLLM team budget)
#   key_fuse         per-key ceiling — leak blast radius, not a pacing tool
#   advisory_weekly  stored and validated, but nothing reads it yet — a pacing
#                    number for a future "on pace" view; never blocks
#
# college:  unions that college's model pack into this course's models —
#           a college is a MODEL PACK, not an org chart.
#
# capabilities:  agent-builder powers for this course's instance.  Default:
#           [file_search, tools, artifacts].  `actions` (arbitrary-URL tool
#           calls) is EXCLUDED by default — it's the one path around the
#           gateway's guardrails and metering (spec: "The floor").  Add it
#           per course only with eyes open, and with allowed_domains below.
#           Omit the key for the default; write `capabilities: []` to give a
#           course NONE — an explicit empty list is honored, not defaulted.
#           Names are NOT validated by LibreChat: a typo fails closed and
#           silently, so run `just course-check` after editing this.
#
# allowed_domains:  where THIS course's agent Actions may reach.  Renders to
#           LibreChat's top-level actions.allowedDomains.  Bare hostnames,
#           `*.wildcards`, `scheme://host`, or `host:port` — never URL paths.
#           Leaving it out while `actions` is enabled means agent Actions can
#           call any public address; there is no way to spell "deny all," so
#           the off switch is omitting `actions` from capabilities.
#
# mcp_domains:  where MCP servers this course's staff add in the chat may
#           connect.  Renders to mcpSettings.allowedDomains after the
#           platform's own two hosts, so leaving it out is CLOSED — unlike
#           allowed_domains.  Public DNS names only (`tools.example.org`,
#           `*.example.org`, `https://host:port`): listing a host also lifts
#           LibreChat's private-address block for it, so course-check refuses
#           IPs, container names and localhost.  Whatever the model sends a
#           server here leaves the platform — apex/your-own-tools.md.

courses:
  engr301-2026fall:
    name: "ENGR 301 — Engineering Design (Fall 2026)"
    instructors:
      - prof.vex@example.edu
    tas: []
    budgets:
      course: 1000
      key_fuse: 5
      advisory_weekly: 2
    models: [almanac-chat]
    # How large one conversation may grow before LibreChat trims it.  Optional
    # — omit it and the course gets REGISTRAR_DEFAULT_CONTEXT_TOKENS (128000).
    #
    # SET THIS if your models resolve to a self-hosted endpoint serving less
    # than that, which many do.  The default is a cost cap chosen for the
    # large hosted models; it is NOT a safe ceiling for a small local one.
    # Too small trims a conversation sooner (fine).  Too large is QUIET and
    # worse: Ollama drops the FRONT of an over-long prompt and answers anyway,
    # and the front is the agent's own instructions.  Set this from what your
    # endpoint SERVES, not from what the model supports — on Ollama those
    # differ silently (`/api/ps` on a loaded model is the honest read).
    # The registrar can't choose for you — `almanac-chat` is an alias, and
    # what it resolves to is whatever INFERENCE_MODEL names on this box.
    # context_tokens: 8000
    group: ""            # globus backend (Phase 2): the managed group's UUID
    students:
      - amaya@example.edu
      - bram@example.edu
    aliases: {}
    # The stable address: engr301.<domain> 302s to whichever term claims it,
    # so a syllabus link survives next fall's engr301-2027fall.  A course is
    # one term and its id is never reused (docs/registrar-spec.md, "The term").
    address: engr301

  chem101-2026fall:
    name: "CHEM 101 — General Chemistry (Fall 2026)"
    instructors:
      - prof.okoye@example.edu
    tas: []
    budgets:
      course: 1000
      key_fuse: 5
      advisory_weekly: 2
    models: [almanac-chat]
    group: ""
    students:
      - amaya@example.edu     # enrolled in BOTH demo courses on purpose —
      - divya@example.edu     # the per-course key + wall test needs it
    aliases: {}

# colleges:
#   cci:
#     models: [cci-llama]        # their endpoint, registered once at the gateway

admins: []                       # platform folks who may pull EVERY course's usage

# The platform team's bug queue, and nothing else.  Separate from admins: on
# purpose — a report is something a person CHOSE to send you, while the fleet
# view is every student who chose nothing, so handing someone the report queue
# must not hand them every roster on the box.  Admins triage implicitly.
devs: []                         # may read and work `reports` / `report_triage`
