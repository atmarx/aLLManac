# The registrar's course records — copied to courses.yaml on first `just up`
# (courses.yaml is gitignored: real rosters are student emails, and those
# don't belong in git).  Operator-edited AND registrar-maintained — the
# roster tools write `students:` back here (file backend), and `just course`
# is the front door for new records.  Full story: docs/registrar-spec.md.
#
# budgets, the three layers (one pool, decided 2026-07-22):
#   course           THE cap — per term, HARD, chat + vAPI keys drain it together
#                    (enforced as the course's LiteLLM team budget)
#   key_fuse         per-key ceiling — leak blast radius, not a pacing tool
#   advisory_weekly  what "on pace" means in the usage tools; never blocks
#
# college:  unions that college's model pack into this course's models —
#           a college is a MODEL PACK, not an org chart.
#
# capabilities:  agent-builder powers for this course's instance.  Default:
#           [file_search, tools, artifacts].  `actions` (arbitrary-URL tool
#           calls) is EXCLUDED by default — it's the one path around the
#           gateway's guardrails and metering (spec: "The floor").  Add it
#           per course only with eyes open, and with allowed_domains below.
#           Omit the key for the default; write `capabilities: []` to give a
#           course NONE — an explicit empty list is honored, not defaulted.
#           Names are NOT validated by LibreChat: a typo fails closed and
#           silently, so run `just course-check` after editing this.
#
# allowed_domains:  where THIS course's agent Actions may reach.  Renders to
#           LibreChat's top-level actions.allowedDomains.  Bare hostnames,
#           `*.wildcards`, `scheme://host`, or `host:port` — never URL paths.
#           Leaving it out while `actions` is enabled means agent Actions can
#           call any public address; there is no way to spell "deny all," so
#           the off switch is omitting `actions` from capabilities.

courses:
  engr301-2026fall:
    name: "ENGR 301 — Engineering Design (Fall 2026)"
    instructors:
      - prof.vex@northwinds.edu
    tas: []
    budgets:
      course: 1000
      key_fuse: 5
      advisory_weekly: 2
    models: [almanac-chat]
    group: ""            # globus backend (Phase 2): the managed group's UUID
    students:
      - amaya@northwinds.edu
      - bram@northwinds.edu
    aliases: {}

  chem101-2026fall:
    name: "CHEM 101 — General Chemistry (Fall 2026)"
    instructors:
