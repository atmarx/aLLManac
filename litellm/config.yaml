# LiteLLM gateway config.
# Chain: LibreChat -> LiteLLM (model_name) -> your inference (api_base).
#
# INFERENCE_BASE_URL decides where tokens come from (set in .env):
#   http://host.docker.internal:8000/v1   the vllm/ stack on this box (just vllm-up)
#   http://gpu01.lab.edu:11434/v1         a campus Ollama box
#   http://gpu02.lab.edu:8000/v1          a remote vLLM (e.g. the vllm/ stack there)
#   https://api.openai.com/v1             cloud, if you must (set INFERENCE_API_KEY)
#
# INFERENCE_MODEL is "openai/<name the endpoint actually serves>" — the
# VLLM_SERVED_NAME for the gpu profile, or the model tag for Ollama (e.g.
# openai/qwen3:30b-a3b).  "openai/" just means "OpenAI-compatible endpoint" —
# it is not OpenAI.  Both come from .env; this file stays generic.
model_list:
  - model_name: almanac-chat
    litellm_params:
      model: os.environ/INFERENCE_MODEL
      api_base: os.environ/INFERENCE_BASE_URL
      api_key: os.environ/INFERENCE_API_KEY

  # More models = more blocks (or add them live in the admin UI — models added
  # there persist in the database via STORE_MODEL_IN_DB).
  # - model_name: almanac-code
  #   litellm_params:
  #     model: openai/qwen2.5-coder
  #     api_base: http://gpu02.lab.edu:8000/v1
  #     api_key: "dummy"

  # Optional: route embeddings through the gateway instead of the RAG API's
  # local CPU model — stand up an embed endpoint, then set
  # EMBEDDINGS_PROVIDER=openai + RAG_OPENAI_BASEURL=http://litellm:4000/v1
  # on the rag_api service.
  # - model_name: almanac-embed
  #   litellm_params:
  #     model: openai/bge
  #     api_base: http://vllm-embed:8000/v1
  #     api_key: "dummy"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 600
