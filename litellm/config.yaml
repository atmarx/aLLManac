# LiteLLM gateway config.
# Chain: LibreChat -> LiteLLM (model_name) -> your inference (api_base).
#
# INFERENCE_BASE_URL decides where tokens come from (set in .env):
#   http://host.docker.internal:8000/v1   site/inference/ vLLM here (just vllm-up)
#   http://gpu01.lab.edu:11434/v1         a campus Ollama box
#   http://gpu02.lab.edu:8000/v1          a remote vLLM (e.g. that box's site/inference/)
#   https://api.openai.com/v1             cloud, if you must (set INFERENCE_API_KEY)
#
# INFERENCE_MODEL is "openai/<name the endpoint actually serves>" — the
# VLLM_SERVED_NAME for the gpu profile, or the model tag for Ollama (e.g.
# openai/qwen3:30b-a3b).  "openai/" just means "OpenAI-compatible endpoint" —
# it is not OpenAI.  Both come from .env; this file stays generic.
model_list:
  - model_name: almanac-chat
    litellm_params:
      model: os.environ/INFERENCE_MODEL
      api_base: os.environ/INFERENCE_BASE_URL
      api_key: os.environ/INFERENCE_API_KEY

  # ---- almanac-office: the hosted model the front office runs on -----------
  # Uncomment, set the three OFFICE_* vars in .env, redeploy.  A separate
  # model_name on purpose, NOT a re-point of almanac-chat: per-course `models:`
  # lists are what decide who may spend cloud money, and that only works if
  # the cloud model has its own name (docs/registrar-spec.md).
  #
  # WHY THIS EXISTS: the vestibule's guide agents regurgitate attached docs,
  # hold a boundary, and call one or two constrained tools.  Four local models
  # were measured against that job and none held it — one jailbroke, one
  # invented an entire storage architecture, one returned an empty message
  # (docs/design-walls.md, "The guide agents need a small *frontier* model").
  # It is also the cheapest place in the platform to spend cloud tokens: six
  # agents, low volume, and a knowledge corpus that is this repository's own
  # public documentation, so nothing leaving the box is unpublished.
  #
  # PRICES.  Best case is Azure AI Foundry: LiteLLM reads the real
  # per-deployment rates when it polls the endpoint, so the ledger carries
  # true pricing instead of a number somebody typed.  Use that where you have
  # it and set nothing here.
  #
  # Otherwise LiteLLM prices from its cost map, and THE COST MAP IS NOT PART
  # OF THE PIN.  It is re-downloaded at every boot and falls back silently to
  # a bundled backup that is nearly a thousand models smaller (measured
  # 2026-09-12: 3889 fetched vs 2909 bundled, with the current hosted
  # families in the first and absent from the second).  So a digest-pinned
  # image prices differently depending on whether it reached GitHub at
  # startup, and on an air-gapped box it prices a current model at $0 with no
  # error.  See docs/design-walls.md, "The cost map is not part of the pin".
  #
  # If you are not on Foundry, either leave LITELLM_LOCAL_MODEL_COST_MAP unset
  # and accept boot-time egress plus drift, or set it True and declare the two
  # rates below yourself.  Do not assume the pin knows a model it has never
  # heard of.
  #     input_cost_per_token: 0.0000002     # $0.20 / Mtok  — VERIFY, rates move
  #     output_cost_per_token: 0.0000012    # $1.20 / Mtok
  # - model_name: almanac-office
  #   litellm_params:
  #     model: os.environ/OFFICE_MODEL          # azure_ai/... via Foundry, else openai/...
  #     api_base: os.environ/OFFICE_BASE_URL
  #     api_key: os.environ/OFFICE_API_KEY

  # ---- almanac-declined: what a filtered prompt gets instead of a stack trace
  # Not a model.  `mock_response` short-circuits inside LiteLLM before any
  # dispatch, so this deployment never calls anything and cannot spend.
  #
  # WHY IT EXISTS.  A hosted model with a content filter in front of it
  # refuses the classic injection upstream, and LiteLLM passes the provider's
  # exception through verbatim.  What landed in a student's chat was
  # `litellm.ContentPolicyViolationError ... Azure OpenAI's content management
  # policy` with a Microsoft support link — a raw backend disclosure, handed
  # to the one cohort whose assignment is taking this apart, in week one
  # (measured 2026-09-21, eval case X1 on all five guides).
  #
  # WHY NOT FALL BACK TO THE LOCAL MODEL.  Because that is the same prompt,
  # re-sent to the weakest thing we run.  `gemma3:12b` JAILBROKE on this exact
  # case and `gpt-oss-20b` confabulated an entire storage architecture
  # (docs/design-walls.md, "The guide agents need a small *frontier* model").
  # A model fallback would turn "the filter caught it" into "trip the filter
  # and you get routed to the model that folds" — a bypass, on demand,
  # reachable by typing the one line the filter is watching for.  The decline
  # has to come from somewhere that cannot be talked to.
  #
  # The wording is the pedagogy lane's (docs/agent-contract.md): light
  # decline, no backend named, hand off to the Security Guide.  Note this is
  # a canned sentence and the design wall warns that canned sentences misfire
  # — but that wall is about a script INSIDE the prompt, which a model
  # pattern-matches on.  This one is at the gateway, after the model already
  # refused, so it is never in any prompt and cannot be reached for.
  - model_name: almanac-declined
    litellm_params:
      model: openai/almanac-declined
      api_key: "unused — mock_response never dispatches"
      mock_response: "I can't help with that one.  If you're curious how the guardrails here work, the Security Guide is the right place to ask."

  # More models = more blocks, HERE, in git.  Do not add them in the admin UI:
  # STORE_MODEL_IN_DB now defaults to False, so anything added there is not
  # persisted at all — and while it was True, what it persisted was ENCRYPTED
  # with the master key, so a UI-added model was discoverable from neither the
  # repo nor the database.  One of them outlived the tag it pointed at and took
  # a whole vestibule down with a 404 naming a model that existed in no file on
  # any host (docs/design-walls.md).
  # - model_name: almanac-code
  #   litellm_params:
  #     model: openai/qwen2.5-coder
  #     api_base: http://gpu02.lab.edu:8000/v1
  #     api_key: "dummy"

  # Optional: route embeddings through the gateway instead of the RAG API's
  # local CPU model — stand up an embed endpoint, then set
  # EMBEDDINGS_PROVIDER=openai + RAG_OPENAI_BASEURL=http://litellm:4000/v1
  # on the rag_api service.
  # - model_name: almanac-embed
  #   litellm_params:
  #     model: openai/bge
  #     api_base: http://vllm-embed:8000/v1
  #     api_key: "dummy"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 600
  # A content-policy refusal is the ONE error class a person should never
  # see raw: it is the provider's exception, it names the provider, and it
  # fires on exactly the prompt someone typed to see what happens.  Route it
  # to the mock decline above — never to another model (see almanac-declined
  # for why that is a bypass, not a fix).  Verified against the live Azure
  # deployment 2026-09-21: X1 in, decline out, no upstream call.
  #
  # One entry per filtered model.  A model with no entry still leaks.
  content_policy_fallbacks: [{"almanac-office": ["almanac-declined"]}]
