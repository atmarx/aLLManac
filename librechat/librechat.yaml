# LibreChat config.  Docs: https://librechat.ai/docs/configuration/librechat_yaml
# If LibreChat warns about the version, bump it to match your image.
#
# THIS FILE IS THE PLATFORM'S COPY, and it is tracked — `just sync` runs
# `git reset --hard origin/main`, so an edit made on a box to make that box
# work does not survive the next deploy.  It happened, and the backup beside
# it is the only reason anyone noticed.
#
# The flagship's `modelSpecs` block is the known case: it carries agent ids,
# which are minted per deployment, and nothing substitutes env vars into this
# document.  That copy lives in `site/librechat/librechat.yaml` with the mount
# repointed in `site/compose.yml` — the procedure is docs/admin-guide.md,
# "The vestibule".  A box using that override does NOT inherit changes made
# here; merge them by hand with a diff.
version: 1.2.8
cache: true

# Identity comes through Keycloak (the openid button).  Native email login is
# controlled by ALLOW_EMAIL_LOGIN / ALLOW_REGISTRATION in .env — off by default.
registration:
  socialLogins: ["openid"]

# Classroom permission posture.  This block seeds BOTH roles at startup — not
# just students.  Anything explicit here beats LibreChat's per-role defaults
# and the seeding loop applies it to USER and ADMIN alike, so faculty (who
# arrive as ADMIN via OPENID_ADMIN_ROLE in .env) end up with an identical
# agent permission set, verified against the running instance.  `public: false`
# below is therefore an INSTANCE-wide off switch, not a student restriction:
# nobody publishes instance-wide from the chat UI.  The admin panel (:3082) is
# the only thing that changes it — it edits these seeded roles at runtime.
#   - students can create agents and share them to people/groups — not
#     instance-public; publishing to the whole class is the faculty's call
#   - the people picker searches users + groups.  The groups here are
#     LibreChat-LOCAL, managed in the admin panel — Keycloak's groups claim
#     never reaches the ACL system in v0.8.7 (upstream librechat#10006)
#   - the Agent Marketplace is ON: it's how the class discovers shared agents
interface:
  agents:
    use: true
    create: true
    share: true
    # TRUE on the flagship only.  The flagship is the vestibule — the one room
    # everyone can walk into — and the guide agents are platform artifacts that
    # everybody is meant to reach.  Course instances render their own config and
    # keep the classroom posture (sharing off by default, docs/design-walls.md).
    public: true
  peoplePicker:
    users: true
    groups: true
    roles: false
  marketplace:
    use: true

# Course materials are PDFs and slide decks, not disk images — cap uploads:
fileConfig:
  endpoints:
    default:
      fileLimit: 10        # files per request
      fileSizeLimit: 25    # MB per file
      totalSizeLimit: 100  # MB per request

# LibreChat's SSRF guard blocks private hosts for MCP by default —
# allowedAddresses exempts our one in-network service (exact host:port)
# while leaving the default posture intact for everything else:
mcpSettings:
  allowedAddresses:
    - "usage-mcp:8080"

# Usage stats as chat tools (the usage-mcp service in compose.yml).  The two
# {{placeholders}} are LibreChat's dynamic user fields: every tool call
# carries WHO IS ASKING (email) and WHETHER THEY'RE FACULTY (role) as trusted
# headers — the service scopes every answer by them, so students only ever
# see themselves and faculty see their own course.  Identity is never a tool
# argument.  The bearer token proves the calls come from LibreChat itself.
# Attach these tools to an agent (e.g. a marketplace "Almanac Usage" agent —
# the admin guide has the recipe) and "what did I burn this week?" just works.
mcpServers:
  almanac-usage:
    type: streamable-http
    url: http://usage-mcp:8080/mcp
    headers:
      Authorization: "Bearer ${USAGE_MCP_TOKEN}"
      X-User-Email: "{{LIBRECHAT_USER_EMAIL}}"
      X-User-Role: "{{LIBRECHAT_USER_ROLE}}"

endpoints:
  # Campus models, routed + metered by LiteLLM.  One endpoint, every backend —
  # which GPU (or cloud) actually serves it is LiteLLM's business.
  custom:
    - name: "Almanac"
      apiKey: "${LITELLM_MASTER_KEY}"
      baseURL: "http://litellm:4000/v1"
      # Every chat request carries WHO asked: LiteLLM reads this standard
      # header with zero gateway config (verified against our pinned build)
      # and writes the student into the spend row's end_user — per-student
      # attribution even on this shared service key.  Non-ASCII emails arrive
      # base64-encoded; campus addresses are ASCII in practice.
      headers:
        x-litellm-end-user-id: "{{LIBRECHAT_USER_EMAIL}}"
      models:
        default: ["almanac-chat"]
        fetch: true
      titleConvo: true
      titleModel: "almanac-chat"
      modelDisplayLabel: "Almanac (campus models)"

  # Custom GPTs = LibreChat Agents.  These capabilities let faculty/students
  # attach knowledge files (RAG) and tools to a shared agent — and an
  # Editor-ACL grant to a group lets the group co-edit ONE agent (the #1 want).
  # Deliberately NO execute_code (no sandbox on campus) and NO web_search (no
  # third-party search keys) — add them consciously if you stand those up.
  #
  # And deliberately NO `actions` (2026-08-11).  This is the front office: one
  # room, open to any campus login, and `actions` is the documented path around
  # the gateway's metering (docs/registrar-spec.md, "The floor").  It was on
  # here with no allowlist — reaching the entire public internet — because the
  # floor was laid in the registrar's RENDERED course configs and this file is
  # hand-maintained, so nothing carried the policy across.  `just egress-check`
  # found it; that recipe exists so the next drift is caught by a machine
  # rather than by luck.
  #
  # There is no "deny all" to write instead: an empty `allowedDomains` is NO
  # allowlist, not an empty one.  Omitting the capability is the only complete
  # off switch.  The office's exemplar agents don't need it anyway — Ask the
  # Almanac is RAG (file_search), and the rest are MCP servers, which are
  # `tools` and not `actions`.  If you ever do turn it on, add a TOP-LEVEL
  # `actions.allowedDomains:` in the same edit and re-run `just egress-check`.
  agents:
    capabilities: ["file_search", "tools", "artifacts"]
