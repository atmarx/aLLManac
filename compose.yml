# The aLLManac — a self-hosted custom-GPT service for classes and labs.
# LibreChat (UI) -> LiteLLM (keys + metering) -> your inference (local vLLM,
# a campus GPU box, or a cloud endpoint), with Keycloak as the front door.
#
# Profiles (set COMPOSE_PROFILES in .env, comma-separated):
#   (none)      core stack — UI, gateway, identity; inference is WHEREVER
#               INFERENCE_BASE_URL points (a remote GPU box, a cloud API)
#   edge        add the Caddy front door (TLS + hostnames) for real deployments
#   workbench   the opencode coding harness, run-on-demand (never a daemon):
#               just workbench <key> / just workbench-smoke <key>
#
# Local GPU inference is its OWN stack now — vllm/compose.yml — so the model
# stays loaded while this stack deploys/bounces:  just vllm-up / vllm-down.
#
# Images are PINNED (here and in .env.example) — bump deliberately: edit,
# deploy, verify, commit.  Override per-box via the *_IMAGE vars in .env.
name: almanac

services:

  # ---- Gateway: virtual keys, routing, metering — the ledger lives here -----
  litellm-db:
    image: postgres:16-alpine
    container_name: alm-litellm-db
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: "${LITELLM_DB_PASSWORD}"
      POSTGRES_DB: litellm
    volumes:
      - litellm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-stable@sha256:47afa74b495c802317712e5b8c8a65e7ca30c96636e9b618a5f8130eec72a8ee}
    container_name: alm-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      DATABASE_URL: "postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm"
      STORE_MODEL_IN_DB: "True"
      # Where the tokens actually come from — see litellm/config.yaml.  The
      # default reaches the vllm/ stack published on THIS box's host (see
      # extra_hosts below); a remote GPU box or cloud URL works the same way.
      INFERENCE_BASE_URL: "${INFERENCE_BASE_URL:-http://host.docker.internal:8000/v1}"
      INFERENCE_API_KEY: "${INFERENCE_API_KEY:-dummy-local-endpoints-ignore-this}"
      INFERENCE_MODEL: "${INFERENCE_MODEL:-openai/qwen2.5}"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    # So the default INFERENCE_BASE_URL can reach the separate vllm/ stack
    # (or anything else) published on this box's host ports:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      litellm-db:
        condition: service_healthy
    restart: unless-stopped

  # ---- LibreChat + its data plane -------------------------------------------
  mongodb:
    image: mongo:7
    container_name: alm-mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: alm-meili
    environment:
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    restart: unless-stopped

  vectordb:
    image: pgvector/pgvector:pg16
    container_name: alm-vectordb
    environment:
      POSTGRES_DB: vectordb
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: "${RAG_DB_PASSWORD}"
    volumes:
      - vector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d vectordb"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rag_api:
    image: ${RAG_API_IMAGE:-ghcr.io/danny-avila/librechat-rag-api-dev:latest@sha256:c3e1a05bdd576b5000fa0e8a84a476e9858fa9219b2b5d78432ddce12c9fcf23}
    container_name: alm-rag
    environment:
      DB_HOST: vectordb
      DB_PORT: "5432"
      POSTGRES_DB: vectordb
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: "${RAG_DB_PASSWORD}"
      RAG_PORT: "8000"
      # Local embeddings (CPU) — no second GPU model, no gateway coupling. To
      # route embeddings through LiteLLM instead, set EMBEDDINGS_PROVIDER=openai
      # and RAG_OPENAI_BASEURL=http://litellm:4000/v1 (see litellm/config.yaml).
      EMBEDDINGS_PROVIDER: huggingface
      EMBEDDINGS_MODEL: "BAAI/bge-small-en-v1.5"
    volumes:
      - hf-cache:/root/.cache/huggingface
    depends_on:
      vectordb:
        condition: service_healthy
    restart: unless-stopped

  librechat:
    image: ${LIBRECHAT_IMAGE:-ghcr.io/danny-avila/librechat:v0.8.7}
    container_name: alm-librechat
    ports:
      - "${CHAT_PORT:-3080}:3080"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      MONGO_URI: "mongodb://mongodb:27017/LibreChat"
      MEILI_HOST: "http://meilisearch:7700"
      RAG_API_URL: "http://rag_api:8000"
      CONFIG_PATH: "/app/librechat.yaml"
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat-images:/app/client/public/images
      - librechat-logs:/app/api/logs
      # Read-only view of the edge's PKI so Node can trust Caddy's internal CA
      # (set NODE_EXTRA_CA_CERTS in .env — see "LAN HTTPS" in .env.example):
      - caddy-data:/caddy-data:ro
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_started
      rag_api:
        condition: service_started
      litellm:
        condition: service_started
      keycloak:
        condition: service_healthy
      edge:
        condition: service_healthy
        required: false
    # The librechat container must resolve ALMANAC_HOST to reach Keycloak. If
    # ALMANAC_HOST is a hostname (not an IP), uncomment to map it to the host:
    # extra_hosts:
    #   - "${ALMANAC_HOST}:host-gateway"
    restart: unless-stopped

  # ---- LibreChat admin panel: local groups, roles, config overrides ----------
  # The groups you SHARE AGENTS TO are LibreChat-local (or Entra) in v0.8.7 —
  # the Keycloak groups claim does not create shareable principals (upstream
  # librechat#10006 is open).  This panel is the official GUI for those local
  # groups + per-role permissions.  Faculty land in it as ADMINs automatically
  # (OPENID_ADMIN_ROLE maps the realm's `faculty` role) and sign in with the
  # same SSO button.  Admin-facing — keep it off the public front door.
  admin-panel:
    image: ${ADMIN_PANEL_IMAGE:-registry.librechat.ai/clickhouse/librechat-admin-panel:latest@sha256:9a78851f84f448eab780ac658c4d17db51974c240492affc789a72d61e35f678}
    container_name: alm-admin-panel
    environment:
      PORT: "3000"
      SESSION_SECRET: "${ADMIN_PANEL_SESSION_SECRET}"
      # Server-side path to LibreChat (in-network) vs the URL the BROWSER uses:
      API_SERVER_URL: "http://librechat:3080"
      VITE_API_BASE_URL: "${DOMAIN_CLIENT:-http://localhost:3080}"
      # Plain-HTTP deployment shapes need a non-Secure session cookie or the
      # SSO PKCE callback dies; harmless when TLS terminates in front:
      SESSION_COOKIE_SECURE: "${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}"
    ports:
      - "${ADMIN_PANEL_PORT:-3082}:3000"
    depends_on:
      librechat:
        condition: service_started
    restart: unless-stopped

  # ---- Usage stats, served back into the chat (MCP) ---------------------------
  # "How much have I used?" / "Who in my course hasn't started?" — answered in
  # chat instead of a second dashboard login.  LibreChat injects WHO IS ASKING
  # as headers ({{LIBRECHAT_USER_EMAIL}} / {{LIBRECHAT_USER_ROLE}} in
  # librechat.yaml) and proves itself with USAGE_MCP_TOKEN; identity is never
  # a tool argument.  The service reads the ledger through usage_ro, a
  # SELECT-only role `just up` provisions — the master key never enters it.
  # Course scoping lives in usage-mcp/roster.yaml (gitignored; edit live).
  # The 127.0.0.1 bind exists for `just smoke` — nothing off-box reaches it.
  usage-mcp:
    build: ./usage-mcp
    container_name: alm-usage-mcp
    environment:
      USAGE_MCP_TOKEN: "${USAGE_MCP_TOKEN}"
      USAGE_DB_PASSWORD: "${USAGE_DB_PASSWORD}"
    volumes:
      - ./usage-mcp/roster.yaml:/app/roster.yaml:ro
    ports:
      - "127.0.0.1:${USAGE_MCP_PORT:-8090}:8080"
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      # 200 only when the DB answers through usage_ro — a missing role reads
      # as unhealthy here and as a FAIL in `just smoke`, never as silence.
      # (urlopen raises on 503/refused -> nonzero exit -> unhealthy.)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ---- Identity: Keycloak OIDC — mocked campus groups now, Globus later -----
  keycloak-db:
    image: postgres:16-alpine
    container_name: alm-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "${KC_DB_PASSWORD}"
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.5
    container_name: alm-keycloak
    command: ["start-dev", "--import-realm"]
    # .env rides along so optional KC_* tuning (e.g. KC_PROXY_HEADERS=xforwarded
    # behind the edge) reaches Keycloak; explicit values below still win.
    env_file:
      - .env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_ADMIN}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_ADMIN_PASSWORD}"
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KC_DB_PASSWORD}"
      KC_HOSTNAME: "${KC_HOSTNAME:-${ALMANAC_HOST:-localhost}}"
      KC_HOSTNAME_PORT: "${KC_HOSTNAME_PORT:-8080}"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-northwinds.json:/opt/keycloak/data/import/realm-northwinds.json:ro
    ports:
      - "${AUTH_PORT:-8080}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    # Ready = realm served (management port 9000, KC_HEALTH_ENABLED).  The KC
    # image ships no curl/wget, so bash's /dev/tcp does the HTTP by hand.
    # LibreChat gates on this — its OIDC discovery is one-shot at boot.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  # ---- Local model engine: MOVED to its own stack — vllm/compose.yml ---------
  # (so the model stays loaded while this stack deploys:  just vllm-up)

  # ---- Coding harness (profile: workbench): opencode against the gateway ----
  # Not a daemon — a run-on-demand container for proving a student's vAPI key
  # works end to end, and for demos/workshops on the box.  Students put the
  # SAME provider block (workbench/opencode.json) on their laptops, with the
  # gateway's public URL — see docs/user-guide.md.
  #
  #   just workbench sk-...          the opencode TUI, wired to the gateway
  #   just workbench-smoke sk-...    one-shot proof: prints the model's reply
  workbench:
    image: ${OPENCODE_IMAGE:-ghcr.io/anomalyco/opencode:1.18.2}
    profiles: ["workbench"]
    working_dir: /workspace
    environment:
      HOME: /workspace                          # opencode state rides the volume
      ALMANAC_API_KEY: "${ALMANAC_API_KEY:-}"   # injected per run by the recipes
    volumes:
      - workbench-data:/workspace
      - ./workbench/opencode.json:/workspace/opencode.json:ro
    restart: "no"

  # ---- Front door (profile: edge): Caddy — TLS + one hostname per surface ----
  edge:
    build: ./caddy
    profiles: ["edge"]
    container_name: alm-edge
    init: true   # reaps the Dockerfile's backgrounded perms-fixer
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
      - "${EDGE_HTTPS_PORT:-443}:443/udp"    # HTTP/3
      # Keycloak's dedicated TLS listener when AUTH_HOST carries :8443 (the
      # no-DNS LAN mode — see .env.example "LAN HTTPS"):
      - "${EDGE_AUTH_PORT:-8443}:8443"
      - "${EDGE_AUTH_PORT:-8443}:8443/udp"   # HTTP/3
    environment:
      CHAT_HOST: "${CHAT_HOST:-chat.localhost}"
      AUTH_HOST: "${AUTH_HOST:-auth.localhost}"
      GATEWAY_HOST: "${GATEWAY_HOST:-gateway.localhost}"
      EDGE_TLS: "${EDGE_TLS:-internal}"
      EDGE_DEFAULT_SNI: "${EDGE_DEFAULT_SNI:-localhost}"
      ACME_EMAIL: "${ACME_EMAIL:-ops@example.edu}"
      # Only needed if you enable the acme_dns azure block in the Caddyfile:
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
      AZURE_SUBSCRIPTION_ID: "${AZURE_SUBSCRIPTION_ID:-}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # Healthy = config loaded and serving (admin endpoint answers).  LibreChat
    # waits on this so its one-shot OIDC discovery never races the edge's TLS.
    healthcheck:
      # 127.0.0.1 explicitly — caddy's admin binds v4-only, and busybox wget
      # resolves `localhost` to ::1 first (refused -> false unhealthy):
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  hf-cache:
  litellm-db:
  mongo-data:
  meili-data:
  vector-data:
  librechat-images:
  librechat-logs:
  keycloak-db:
  caddy-data:
  caddy-config:
  workbench-data:
